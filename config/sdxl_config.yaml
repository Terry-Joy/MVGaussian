# config: data/text2tex_data/backpack/9fa2da2c42234b58896e8d23393cac24/config.yaml
config: data/ours_data/race_car/5345d37be48c4202b25ba2e2b5a8540e/config.yaml

exp_cfg:
# general
  seed: 40896914
  device: "cuda:2"
# input
  mesh: 5345d37be48c4202b25ba2e2b5a8540e.obj
  mesh_config_relative: true
  mesh_path: 
  mesh_scale: 1.0
  mesh_autouv: true

  # latent_view_size: 96
  # latent_tex_size: 512
  rgb_view_size: 768
  rgb_tex_size: 768

model_cfg: 
# path
  control_net_path: "diffusers/controlnet-depth-sdxl-1.0"
  sd_path: "stabilityai/stable-diffusion-xl-base-1.0"
  vae_path: "madebyollin/sdxl-vae-fp16-fix"

  num_inference_steps: 30
  # prompt: 'A white pillow resting on a wooden bed, realistic'
  prompt: 'Low poly model of the BMW Csl Hommage R with the racing livery from.'
  negative_prompt: ''
  guidance_scale: 3.5
  control_guidance_start: 0.0
  control_guidance_end: 1.0
  controlnet_conditioning_scale: 0.7
  # conditioning_scale_end: 0.9

render_cfg:
  camera_center:
  # camera_azims: [-180, -135, -90, -45, 0, 45, 90, 135] # 8
  # camera_azims: [-180, -120, -60, 0, 60, 120] # 6
  camera_azims: [0, 90, -180, -90]
  camera_distance: 1.65
  top_cameras: false

  custom_camera_center:
  custom_camera_azims: [-180, -135, -90, -45, 0, 45, 90, 135]


logging_cfg:
  log_interval: 10  
  view_fast_preview: false
  tex_fast_preview: false
  output_dir: 

output: 
prefix: FLUXs
use_mesh_name: true
timeformat: '%d%b%Y-%H%M%S'
cond_type: depth
guess_mode: false
mvd_end: 0.8
mvd_exp_start: 0.0
mvd_exp_end: 6.0
ref_attention_end: 0.2
shuffle_bg_change: 0.4
shuffle_bg_end: 0.8
keep_mesh_uv: false